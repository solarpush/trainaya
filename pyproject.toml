[project]
name = "trainaya-py"
version = "0.3.0"
description = "PyTorch training, calibration, and multi-architecture Ollaya model adaptation engine for Trainaya"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "laya @ https://files.pythonhosted.org/packages/b5/fd/dd60f49451ef43af50c3fcd5d5d9b12aea590f5bcb9afb3e5ec5171b6fa6/laya-0.3.7.tar.gz",
    "torch==2.14.*",
    "transformers==5.17.*",
    "tokenizers==0.23.*",
    "safetensors>=0.8",
    "onnx==1.23.*",
    "onnxscript==0.7.*",
    "onnxruntime==1.30.*",
    "numpy>=2",
    "pyarrow>=20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
