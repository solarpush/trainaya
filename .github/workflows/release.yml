name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: trainaya-linux-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: trainaya-darwin-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Sync Cargo.toml version with Git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing Cargo.toml version to ${VERSION} (from tag ${GITHUB_REF_NAME})"
          python3 -c 'import pathlib, re, sys; p = pathlib.Path("Cargo.toml"); p.write_text(re.sub(r"(?m)^version\s*=\s*\"[^\"]+\"", f"version = \"{sys.argv[1]}\"", p.read_text(), count=1))' "$VERSION"

      - name: Validate Embedded Python Engine Syntax
        run: python3 -m py_compile py_engine/trainaya_py/*.py

      - name: Run Unit & CLI Tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} trainaya
          cd ../../..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
