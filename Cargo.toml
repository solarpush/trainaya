[package]
name = "trainaya"
version = "0.1.0"
edition = "2024"
description = "Fast modular CLI in Rust for fine-tuning, merging, and exporting decision and classification models for Ollaya"
authors = ["Trainaya Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarpush/trainaya"

[[bin]]
name = "trainaya"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.21.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
colored = "2.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hf-hub = "0.4.1"
byteorder = "1.5"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"



[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
