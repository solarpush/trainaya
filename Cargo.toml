[package]
name = "trainaya"
version = "0.3.0"
edition = "2024"
description = "Fast modular CLI in Rust orchestrating uv + PyTorch for fine-tuning, adapting, merging, and exporting decision models for Ollaya"
authors = ["Trainaya Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarpush/trainaya"

[[bin]]
name = "trainaya"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
csv = "1.3"
colored = "2.2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
