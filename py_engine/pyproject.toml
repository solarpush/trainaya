[project]
name = "trainaya-py"
version = "0.3.0"
description = "Embedded PyTorch training, calibration, and multi-architecture GGUF/SafeTensors/ONNX model adaptation engine for Trainaya"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pyarrow>=15.0",
]

[tool.uv]
package = false
